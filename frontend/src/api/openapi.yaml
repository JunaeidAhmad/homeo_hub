components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        remedy_id:
          type: string
          format: uuid
        illness_id:
          type: string
          format: uuid
          nullable: true
        illness_slug:
          nullable: true
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        potency:
          $ref: '#/components/schemas/PotenciesEnum'
        form:
          $ref: '#/components/schemas/FormEnum'
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - form
      - potency
      - remedy_id
    AddPrescriptionToCartResponse:
      type: object
      properties:
        cart:
          allOf:
          - $ref: '#/components/schemas/Cart'
          readOnly: true
        added_count:
          type: integer
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedPrescriptionItem'
      required:
      - added_count
      - cart
      - skipped
    AdminAssignDoctorRequest:
      type: object
      properties:
        doctor_id:
          type: string
          format: uuid
        note:
          type: string
          default: ''
          maxLength: 300
      required:
      - doctor_id
    AdminAssignLineRequest:
      type: object
      properties:
        shop_remedy_id:
          type: string
          format: uuid
      required:
      - shop_remedy_id

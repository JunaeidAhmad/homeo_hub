      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        remedy_name:
          type: string
          maxLength: 150
        potency:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/PotenciesEnum'
          - $ref: '#/components/schemas/NullEnum'
        form:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/FormEnum'
          - $ref: '#/components/schemas/NullEnum'
        quantity:
          type: integer
          maximum: 32767
          minimum: 0
        shop_unit_price_poisha:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
      required:
      - form
      - id
      - potency
      - quantity
      - remedy_name

    SignUpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        gender:
          $ref: '#/components/schemas/GenderEnum'
        age:
          type: integer
          maximum: 120
          minimum: 1
        location_id:
          type: string
          format: uuid
      required:
      - age
      - full_name
      - gender
      - location_id
      - password
      - phone
    Staff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - full_name
      - id
      - is_active
      - last_login
      - roles
      - username
    StaffCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[A-Za-z0-9._-]{3,30}$
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
      required:
      - full_name
      - password
      - roles
      - username
    StaffLogInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - username
    ThermalPreferenceEnum:
      enum:
      - CHILLY
      - HOT
      - AMBIVALENT
      type: string
      description: |-
        * `CHILLY` - Chilly
        * `HOT` - Hot
        * `AMBIVALENT` - Ambivalent
    Verification:
      type: object
      description: A code has been requested; send it back with ``verification_id``.
      properties:
        verification_id:
          type: string
          format: uuid
        phone:
          type: string
        expires_in:
          type: integer
          description: Seconds until the code stops working.
        resend_after:
          type: integer
          description: Seconds to wait before offering a resend.
      required:
      - expires_in
      - phone
      - resend_after
      - verification_id
    VerifyCodeRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
      - verification_id
    VerifyRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
      - verification_id
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

      required:
      - advice_do_en
      - advice_dont_en
      - description_en
      - id
      - indication_en
      - name
      - picture_url
      - prices
      - updated_at
    AdminRemedyRequest:
      type: object
      description: Everything about a remedy, both languages, for the editor.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        name_bn:
          type: string
          maxLength: 150
        slug:
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/RemedyStatusEnum'
        description_en:
          type: string
          minLength: 1
          maxLength: 5000
        description_bn:
          type: string
          maxLength: 5000
        indication_en:
          type: string
          minLength: 1
          maxLength: 5000
        indication_bn:
          type: string
          maxLength: 5000
        advice_do_en:
          type: string
          minLength: 1
          maxLength: 5000
        advice_do_bn:
          type: string
          maxLength: 5000
        advice_dont_en:
          type: string
          minLength: 1
          maxLength: 5000
        advice_dont_bn:
          type: string
          maxLength: 5000

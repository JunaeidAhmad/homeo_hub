      type: object
      properties:
        status:
          $ref: '#/components/schemas/LiveStatusEnum'
      required:
      - status
    LiveStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Location:
      type: object
      description: An area with its names in the language the client asked for.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        division:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        upazila:
          type: string
          readOnly: true
        display_name:
          type: string
          description: 'Upazila, district, division: one line for a picker to show.'
          readOnly: true
      required:
      - display_name
      - district
      - division
      - id
      - upazila
    LogInRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - phone

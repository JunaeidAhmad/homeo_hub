        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health/live:
    get:
      operationId: health_live
      description: The process is up. Never touches the database or Redis.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready
      description: 'The process can serve traffic: Postgres and Redis both answer.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: ''
  /api/v1/locations/:
    get:
      operationId: locations_list
      description: 'Bangladesh areas (division, district, upazila). Public: needed
        before sign-up.'
      parameters:
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: division
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: Keyword search (typo-tolerant, Bangla or English).
        schema:
          type: string
      tags:
      - locations
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
  /api/v1/me/:
    get:
      operationId: me
      tags:
      - account
      security:
      - accessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    AdminMe:
      type: object
      description: The signed-in staff member, with what they are allowed to do.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionEnum'
          readOnly: true
      required:
      - full_name
      - id
      - is_active
      - last_login
      - permissions
      - roles
      - username
    CheckResultEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Error:
      type: object
      description: Every error response (see common/errors.py).
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ForgotPasswordRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 30
      required:
      - phone
    GenderEnum:
      enum:
      - FEMALE
      - MALE
      - OTHER
      type: string
      description: |-
        * `FEMALE` - Female
        * `MALE` - Male
        * `OTHER` - Other
    Live:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LiveStatusEnum'
      required:
      - status
    LiveStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Location:
      type: object
      description: An area with its names in the language the client asked for.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        division:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        upazila:
          type: string
          readOnly: true
        display_name:
          type: string
          description: 'Upazila, district, division: one line for a picker to show.'
          readOnly: true
      required:
      - display_name
      - district
      - division
      - id
      - upazila
    LogInRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - phone
    PaginatedLocationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    PaginatedStaffList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
    PatchedStaffUpdateRequest:
      type: object
      description: Send only what changes.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
    Patient:
      type: object
      description: The signed-in patient's own account.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_type:
          allOf:
          - $ref: '#/components/schemas/PatientUserTypeEnum'
          readOnly: true
        phone:
          type: string
          readOnly: true
        phone_verified:
          type: boolean
          readOnly: true
        full_name:
          type: string
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
        age:
          type: integer
          readOnly: true
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          readOnly: true
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          readOnly: true
      required:
      - age
      - date_of_birth
      - full_name
      - gender
      - id
      - location
      - phone
      - phone_verified
      - preferred_language
      - user_type
    PatientUserTypeEnum:
      enum:
      - patient
      type: string
      description: '* `patient` - patient'
    PermissionEnum:
      enum:
      - manage_staff
      - view_doctors
      - manage_doctors
      - view_cases
      - assign_cases
      - manage_remedies
      - manage_illnesses
      - view_patients
      - view_orders
      - manage_orders
      - view_payments
      - manage_payments
      - manage_own_shop
      type: string
      description: |-
        * `manage_staff` - manage_staff
        * `view_doctors` - view_doctors
        * `manage_doctors` - manage_doctors
        * `view_cases` - view_cases
        * `assign_cases` - assign_cases
        * `manage_remedies` - manage_remedies
        * `manage_illnesses` - manage_illnesses
        * `view_patients` - view_patients
        * `view_orders` - view_orders
        * `manage_orders` - manage_orders
        * `view_payments` - view_payments
        * `manage_payments` - manage_payments
        * `manage_own_shop` - manage_own_shop
    PreferredLanguageEnum:
      enum:
      - en
      - bn
      type: string
      description: |-
        * `en` - English
        * `bn` - Bangla
    Ready:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReadyStatusEnum'
        checks:
          $ref: '#/components/schemas/ReadyChecks'
      required:
      - checks
      - status
    ReadyChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckResultEnum'
        redis:
          $ref: '#/components/schemas/CheckResultEnum'
      required:
      - database
      - redis
    ReadyStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    ResendRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
      required:
      - verification_id
    ResetPasswordRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - code
      - new_password
      - verification_id
    Role:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/RoleEnum'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionEnum'
      required:
      - name
      - permissions
    RoleEnum:
      enum:
      - super_admin
      - admin
      - doctor_manager
      - case_manager
      - remedy_manager
      - illness_manager
      - fulfilment_manager
      - finance
      - support
      - shop_owner
      type: string
      description: |-
        * `super_admin` - super_admin
        * `admin` - admin
        * `doctor_manager` - doctor_manager
        * `case_manager` - case_manager
        * `remedy_manager` - remedy_manager
        * `illness_manager` - illness_manager
        * `fulfilment_manager` - fulfilment_manager
        * `finance` - finance
        * `support` - support
        * `shop_owner` - shop_owner
    Session:
      type: object
      description: Signed in. Keep the access token in memory; the refresh token is
        set as a cookie.
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        user_type:
          $ref: '#/components/schemas/SessionUserTypeEnum'
      required:
      - access_token
      - expires_in
      - user_type
    SessionUserTypeEnum:
      enum:
      - patient
      - staff
      type: string
      description: |-
        * `patient` - patient
        * `staff` - staff
    SignUpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        gender:
          $ref: '#/components/schemas/GenderEnum'
        age:
          type: integer
          maximum: 120
          minimum: 1
        location_id:
          type: string
          format: uuid
      required:
      - age
      - full_name
      - gender
      - location_id
      - password
      - phone
    Staff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - full_name
      - id
      - is_active
      - last_login
      - roles
      - username
    StaffCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[A-Za-z0-9._-]{3,30}$
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
      required:
      - full_name
      - password
      - roles
      - username
    StaffLogInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - username
    Verification:
      type: object
      description: A code has been requested; send it back with ``verification_id``.
      properties:
        verification_id:
          type: string
          format: uuid
        phone:
          type: string
        expires_in:
          type: integer
          description: Seconds until the code stops working.
        resend_after:
          type: integer
          description: Seconds to wait before offering a resend.
      required:
      - expires_in
      - phone
      - resend_after
      - verification_id
    VerifyRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
      - verification_id
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        remedy_id:
          type: string
          format: uuid
        illness_id:
          type: string
          format: uuid
          nullable: true
        illness_slug:
          nullable: true
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        potency:
          $ref: '#/components/schemas/PotenciesEnum'
        form:
          $ref: '#/components/schemas/FormEnum'
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - form
      - potency
      - remedy_id
    AdminAssignLineRequest:
      type: object
      properties:
        shop_remedy_id:
          type: string
          format: uuid
      required:
      - shop_remedy_id

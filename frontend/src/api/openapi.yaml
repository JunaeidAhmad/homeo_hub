      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 30
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
      required:
      - full_name
      - password
      - phone
      - roles
    ThermalPreferenceEnum:
      enum:
      - CHILLY
      - HOT
      - AMBIVALENT
      type: string
      description: |-
        * `CHILLY` - Chilly
        * `HOT` - Hot
        * `AMBIVALENT` - Ambivalent
    UnavailableReasonEnum:
      enum:
      - NOT_LISTED
      - NO_PRICE
      type: string
      description: |-
        * `NOT_LISTED` - NOT_LISTED
        * `NO_PRICE` - NO_PRICE
    UnlockedPrescription:
      type: object
      properties:
        locked:
          type: boolean
          default: false
        prescription:
          $ref: '#/components/schemas/PatientPrescriptionDetail'
        invoice:
          $ref: '#/components/schemas/ConsultationInvoice'
      required:
      - invoice
      - prescription
    UnreadCount:
      type: object
      properties:
        unread_count:
          type: integer
      required:
      - unread_count
    UrgencyEnum:
      enum:
      - ROUTINE
      - SOON
      - URGENT
      type: string
      description: |-
        * `ROUTINE` - Routine
        * `SOON` - Soon
        * `URGENT` - Urgent
    Verification:
      type: object
      description: A code has been requested; send it back with ``verification_id``.
      properties:
        verification_id:
          type: string
          format: uuid
        phone:
          type: string
        expires_in:
          type: integer
          description: Seconds until the code stops working.
        resend_after:
          type: integer
          description: Seconds to wait before offering a resend.
      required:
      - expires_in
      - phone
      - resend_after
      - verification_id
    VerifyCodeRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
      - verification_id
    VerifyRequest:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
      - verification_id
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

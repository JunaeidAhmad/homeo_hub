components:
  schemas:
    AdminIllness:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        category_name_en:
          type: string
          readOnly: true
        name_en:
          type: string
          maxLength: 150
        name_bn:
          type: string
          maxLength: 150
        slug:
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        short_description_en:
          type: string
          maxLength: 2000
        short_description_bn:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/IllnessStatusEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_name_en
      - id
      - name_en
      - short_description_en
      - updated_at
    AdminIllnessCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_en:
          type: string
          maxLength: 150
        name_bn:
          type: string
          maxLength: 150
        slug:
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name_en
      - updated_at
    AdminIllnessCategoryRequest:
      type: object
      properties:
        name_en:
          type: string
          minLength: 1
          maxLength: 150
        name_bn:
          type: string
          maxLength: 150
        slug:
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
      required:
      - name_en
    AdminIllnessRemedy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        remedy_id:
          type: string
          format: uuid
          readOnly: true
        remedy_name:
          type: string
          readOnly: true
        remedy_name_bn:
          type: string
          readOnly: true
        remedy_slug:
          type: string
          readOnly: true
        remedy_status:
          type: string
          readOnly: true
        picture_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        rank:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - id
      - picture_url
      - rank
      - remedy_id
      - remedy_name
      - remedy_name_bn
      - remedy_slug
      - remedy_status
    AdminIllnessRequest:
      type: object
      properties:
        category:
          type: string
          format: uuid
        name_en:
          type: string
          minLength: 1
          maxLength: 150
        name_bn:
          type: string
          maxLength: 150
        slug:
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        short_description_en:
          type: string
          minLength: 1
          maxLength: 2000
        short_description_bn:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/IllnessStatusEnum'
      required:
      - category
      - name_en
      - short_description_en
    AdminMe:
      type: object
      description: The signed-in staff member, with what they are allowed to do.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionEnum'
          readOnly: true
      required:
      - full_name
      - id
      - is_active
      - last_login
      - permissions
      - roles
      - username
    AdminPrice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        form:
          $ref: '#/components/schemas/FormEnum'
        price_poisha:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - form
      - id
      - price_poisha
      - updated_at
    AdminPriceInputRequest:
      type: object
      properties:
        form:
          $ref: '#/components/schemas/FormEnum'
        price_poisha:
          type: integer
          maximum: 10000000
          minimum: 1
        is_active:
          type: boolean
          default: true
      required:
      - form
      - price_poisha
    AdminPriceRequest:
      type: object
      properties:
        form:
          $ref: '#/components/schemas/FormEnum'
        price_poisha:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - form
      - price_poisha
    AdminRankedRemediesInputRequest:
      type: object
      properties:
        remedy_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - remedy_ids
    AdminRemedy:
      type: object
      description: Everything about a remedy, both languages, for the editor.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        name_bn:
          type: string
          maxLength: 150
        slug:
          oneOf:
          - type: string
            maxLength: 160
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/RemedyStatusEnum'
        description_en:
          type: string
          maxLength: 5000
        description_bn:
          type: string
          maxLength: 5000
        indication_en:
          type: string
          maxLength: 5000
        indication_bn:
          type: string
          maxLength: 5000
        advice_do_en:
          type: string
          maxLength: 5000
        advice_do_bn:
          type: string
          maxLength: 5000
        advice_dont_en:
          type: string
          maxLength: 5000
        advice_dont_bn:
          type: string
          maxLength: 5000
        picture_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        prices:
          type: array

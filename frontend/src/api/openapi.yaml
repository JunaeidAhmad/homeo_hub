      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/staff/logout/:
    post:
      operationId: auth_staff_logout
      description: Acts on one kind of user's refresh cookie.
      parameters:
      - in: header
        name: X-Client
        schema:
          type: string
          enum:
          - web
        required: true
      tags:

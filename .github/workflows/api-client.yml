name: api-client

# Fails when the committed OpenAPI schema / TypeScript client no longer
# matches the backend. Fix: ./scripts/generate-api-client.sh and commit.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/api/**"
      - "frontend/package-lock.json"
      - "scripts/generate-api-client.sh"
      - ".github/workflows/api-client.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/api/**"
      - "frontend/package-lock.json"
      - "scripts/generate-api-client.sh"
      - ".github/workflows/api-client.yml"

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: PYTHON=python ./scripts/generate-api-client.sh --check

name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/homeohub
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      # Postgres 16 ships on the ubuntu-24.04 runner; start it natively (no containers).
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb homeohub
      - name: Install and start Redis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && redis-cli ping

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy .
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        run: pytest -q

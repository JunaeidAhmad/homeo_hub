# Render blueprint for the Django API. The web app deploys to Vercel
# (Root Directory: frontend). Database: Neon (DATABASE_URL). Redis: the Render
# Key Value instance below. See "Deploy" in README.md for the order of steps.
#
# Both services are in Singapore, next to the Neon database; a region can't be
# changed after a service is created. Both use the free plan: the API sleeps when
# idle. Change `plan` for an always-on service.
services:
  - type: keyvalue
    name: homeohub-redis
    plan: free
    region: singapore
    ipAllowList: [] # private network only

  - type: web
    name: homeohub-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string, set in the dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homeohub-redis
          property: connectionString
      # The service's own onrender.com host is also accepted automatically.
      - key: ALLOWED_HOSTS
        value: homeohub-api.onrender.com
      # The web app's address(es), with scheme and no trailing slash, comma-separated.
      # Required: the build fails without it. CSRF_TRUSTED_ORIGINS defaults to the same
      # list and WEB_APP_URL (payment return pages) to its first entry.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Copy this generated value into the web app on Vercel as PROXY_SHARED_SECRET, so
      # rate limits see each visitor rather than the web app's server.
      - key: PROXY_SHARED_SECRET
        generateValue: true
      - key: NUM_PROXIES
        value: "1"
      # S3-compatible bucket for uploaded pictures; uploads are refused until set.
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_DOMAIN
        sync: false
      # Class that sends text messages (sign-up codes). Until a real gateway exists,
      # leaving this empty means sign-up reports that texts cannot be sent.
      - key: SMS_PROVIDER
        sync: false
      # The test payment page: anyone can mark their own payment successful. Replace it
      # with a real gateway class before taking real orders.
      - key: PAYMENT_GATEWAY
        value: apps.payments.gateways.mock.MockGateway
      # Browser push notifications; leave empty to turn them off. Make a key pair with
      # `python manage.py generate_vapid_keys`.
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEBPUSH_SUBJECT
        sync: false # mailto: address push services can contact
